<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/jpeg" sizes="32x32" href="./images/logo.PNG">
  <link rel="icon" type="image/jpeg" sizes="16x16" href="./images/logo.PNG">
  <link rel="apple-touch-icon" href="./images/logo.PNG">
  <title>Chiaha Holdings Ltd</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --brand-color: #011947;
      --blue-dark: #000e2b;
      --blue-mid: #0e388f;
      --blue-light: #60a5fa;
      --white: #ffffff;
      --text-dark: #0f172a;
      --card-bg: #ffffff;
      --card-hover: #f8fafc;
      --shadow: 0 6px 22px rgba(0, 8, 28, 0.35);
      --shadow-hover: 0 10px 30px rgba(0, 8, 28, 0.5);
      --radius: 14px;
    }

    html,
    body {
      min-height: 100vh;
      font-family: 'Jost', sans-serif;
      background-color: #011947;
      color: var(--white);
      overflow-x: hidden;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slider-wrap {
      width: 100%;
      position: relative;
      height: 340px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 8, 28, 0.55);
      background: #000e2b;
    }

    .slides {
      display: flex;
      height: 100%;
      transition: transform 0.55s ease;
    }

    .slide {
      min-width: 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: fill;
    }

    /* DOTS */
    .slider-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      z-index: 10;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.42);
      cursor: pointer;
      border: none;
      transition: 0.25s ease;
    }

    .dot.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* PROFILE */
    .profile {
      display: flex;
      padding: 26px 20px 0;
      text-align: center;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .profile img {
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 14px rgba(0, 30, 40, 0.3);
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.55rem, 6vw, 2rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 30, 40, 0.25);
    }

    .tagline {
      margin-top: 4px;
      font-family: 'Playfair Display', serif;
      font-size: 0.83rem;
      letter-spacing: 0.16em;
      text-transform: capitalize;
      color: rgba(255, 255, 255, 0.92);
    }

    .links {
      width: 100%;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.97rem;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .link-btn:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      color: var(--blue-mid);
    }

    .link-btn i {
      color: var(--brand-color);
      font-size: 1.15rem;
      width: 20px;
      text-align: center;
      transition: transform 0.25s ease;
    }

    .link-btn:hover i {
      transform: scale(1.1);
    }

    .footer {
      margin-top: 44px;
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.88);
      text-align: center;
    }

    @media (max-width: 380px) {
      .slider-wrap {
        height: 260px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- SLIDER -->
    <div class="slider-wrap">
      <div class="slides" id="slides">
        <div class="slide"><img src="./images/img1.PNG" style="height: 135%;"></div>
        <div class="slide"><img src="./images/img2.PNG" style="height: 132%;"></div>
        <div class="slide"><img src="./images/img3.PNG" style="height: 115%;"></div>
        <div class="slide"><img src="./images/img4.PNG" style="height: 135%;"></div>
        <div class="slide"><img src="./images/img5.PNG" style="height: 128%;"></div>
        <div class="slide"><img src="./images/img6.PNG" style="height: 110%;"></div>
        <div class="slide"><img src="./images/img7.PNG" style="height: 132%;"></div>
        <div class="slide"><img src="./images/img8.PNG" style="height: 132%;"></div>
        <div class="slide"><img src="./images/img8b.PNG" style="height: 130%;"></div>
        <div class="slide"><img src="./images/img9.PNG" style="height: 135%;"></div>
        <div class="slide"><img src="./images/img10.PNG" style="height: 130%;"></div>
        <div class="slide"><img src="./images/img11.PNG" style="height: 90%;"></div>
      </div>

      <div class="slider-dots">
        <button class="dot active" data-i="0"></button>
        <button class="dot" data-i="1"></button>
        <button class="dot" data-i="2"></button>
        <button class="dot" data-i="3"></button>
        <button class="dot" data-i="4"></button>
        <button class="dot" data-i="5"></button>
        <button class="dot" data-i="6"></button>
        <button class="dot" data-i="7"></button>
        <button class="dot" data-i="8"></button>
        <button class="dot" data-i="9"></button>
        <button class="dot" data-i="10"></button>
        <button class="dot" data-i="11"></button>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="profile">
      <img src="./images/logo.PNG" width="68" height="68" style="border-radius:50%; margin-bottom:16px;">
      <div>
        <h2 class="name">Chiaha Holdings Ltd</h2>
        <p class="tagline">Building the Future, Today.</p>
      </div>
    </div>

    <!-- LINKS -->
    <div class="links">
      <a class="link-btn" href="about-us.html"><i class="fas fa-circle-info"></i> About Us</a>
      <a class="link-btn" href="https://wa.me/+2347065911133"><i class="fab fa-whatsapp"></i> WhatsApp</a>
      <a class="link-btn" href="#"><i class="fab fa-instagram"></i> Instagram</a>
      <a class="link-btn" href="#"><i class="fab fa-facebook-f"></i> Facebook</a>
      <a class="link-btn" href="#"><i class="fab fa-x-twitter"></i> X (Twitter)</a>
      <a class="link-btn" href="#"><i class="fab fa-tiktok"></i> Tiktok</a>
      <a class="link-btn" href="#"><i class="fab fa-youtube"></i> Youtube</a>
      <a class="link-btn" href="contact.html"><i class="fas fa-phone-volume"></i> Contact Us</a>
    </div>

    <p class="footer">© 2026 Chiaha Holdings Ltd</p>
  </div>

  <script>
    const track = document.getElementById('slides');
    const dots = document.querySelectorAll('.dot');
    let cur = 0;
    const TOTAL = 12; // Update this if you add/remove slides

    function goTo(n) {
      cur = (n + TOTAL) % TOTAL;
      track.style.transform = `translateX(-${cur * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === cur));
    }

    dots.forEach(d => d.onclick = () => goTo(+d.dataset.i));

    setInterval(() => goTo(cur + 1), 3000);
  </script>
</body>

</html>
