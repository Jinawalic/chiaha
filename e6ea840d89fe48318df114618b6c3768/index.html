<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/webp" sizes="32x32" href="./images/logo.webp">
  <link rel="icon" type="image/webp" sizes="16x16" href="./images/logo.webp">
  <link rel="apple-touch-icon" href="./images/logo.webp">
  <link rel="preload" as="image" href="./images/img1.webp" type="image/webp">
  <title>Chiaha Holdings Ltd</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Jost:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --brand-color: #011947;
      --blue-dark: #000e2b;
      --blue-mid: #0e388f;
      --blue-light: #60a5fa;
      --white: #ffffff;
      --text-dark: #0f172a;
      --card-bg: #ffffff;
      --card-hover: #f8fafc;
      --shadow: 0 6px 22px rgba(0, 8, 28, 0.35);
      --shadow-hover: 0 10px 30px rgba(0, 8, 28, 0.5);
      --radius: 14px;
    }

    html,
    body {
      min-height: 100vh;
      font-family: 'Jost', sans-serif;
      background-color: #011947;
      color: var(--white);
      overflow-x: hidden;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 0 0 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .slider-wrap {
      width: 100%;
      position: relative;
      height: 318px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0, 8, 28, 0.55);
      background: #000e2b;
    }

    .slides {
      display: flex;
      height: 100%;
      transition: transform 0.55s ease;
    }

    .slide {
      min-width: 100%;
      height: 100%;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* DOTS */
    .slider-dots {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      z-index: 10;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.42);
      cursor: pointer;
      border: none;
      transition: 0.25s ease;
    }

    .dot.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* SLIDER NAVIGATION BUTTONS */
    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(0, 14, 43, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.28);
      backdrop-filter: blur(4px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: all 0.25s ease;
      font-size: 0.85rem;
    }

    .slider-btn:hover,
    .slider-btn:active {
      background: rgba(0, 14, 43, 0.85);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-50%) scale(1.08);
    }

    .prev-btn {
      left: 10px;
    }

    .next-btn {
      right: 10px;
    }

    /* PROFILE */
    .profile {
      display: flex;
      padding: 26px 20px 0;
      text-align: center;
      flex-direction: row;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .profile img {
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 4px 14px rgba(0, 30, 40, 0.3);
    }

    .name {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.55rem, 6vw, 2rem);
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 2px 8px rgba(0, 30, 40, 0.25);
      text-transform: uppercase;
    }

    .tagline {
      margin-top: 4px;
      font-family: 'Playfair Display', serif;
      font-size: 0.83rem;
      letter-spacing: 0.16em;
      text-transform: capitalize;
      color: rgba(255, 255, 255, 0.92);
    }

    .links {
      width: 100%;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 15px 20px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      text-decoration: none;
      color: var(--text-dark);
      font-size: 0.97rem;
      font-weight: 600;
      transition: all 0.25s ease;
    }

    .link-btn:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      color: var(--blue-mid);
    }

    .link-btn i {
      color: var(--brand-color);
      font-size: 1.15rem;
      width: 20px;
      text-align: center;
      transition: transform 0.25s ease;
    }

    .link-btn:hover i {
      transform: scale(1.1);
    }

    .footer {
      margin-top: 44px;
      font-size: 0.76rem;
      color: rgba(255, 255, 255, 0.88);
      text-align: center;
    }

    @media (max-width: 380px) {
      .slider-wrap {
        height: 260px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <!-- SLIDER -->
    <div class="slider-wrap">
      <div class="slides" id="slides">
        <div class="slide"><img src="./images/img1.webp" alt="Chiaha Holdings slide 1" width="1200" height="960" fetchpriority="high" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img2.webp" alt="Chiaha Holdings slide 2" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img3.webp" alt="Chiaha Holdings slide 3" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img4.webp" alt="Chiaha Holdings slide 4" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img5.webp" alt="Chiaha Holdings slide 5" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img6.webp" alt="Chiaha Holdings slide 6" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img7.webp" alt="Chiaha Holdings slide 7" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img8.webp" alt="Chiaha Holdings slide 8" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img9.webp" alt="Chiaha Holdings slide 9" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img10.webp" alt="Chiaha Holdings slide 10" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
        <div class="slide"><img src="./images/img11.webp" alt="Chiaha Holdings slide 11" width="1200" height="960" loading="lazy" style="height: 100%;"></div>
      </div>

      <div class="slider-dots">
        <button class="dot active" data-i="0"></button>
        <button class="dot" data-i="1"></button>

        <button class="dot" data-i="3"></button>

      <!-- SLIDER ARROWS -->
      <button class="slider-btn prev-btn" id="prevSlide" aria-label="Previous slide">

    <!-- PROFILE -->
    <div class="profile">

    <!-- LINKS -->
    <div class="links">

      <a class="link-btn" href="https://x.com/ChiahaHoldings"><i class="fab fa-x-twitter"></i> X (Twitter)</a>
      <a class="link-btn" href="https://www.tiktok.com/@chiaha.holdings?_r=1&_t=ZS-99nkUX2kLZs"><i
          class="fab fa-tiktok"></i> Tiktok</a>
      <a class="link-btn" href="https://youtube.com/@chiahaholdings?si=trfKhdWQFyaU4bpm"><i class="fab fa-youtube"></i>
        Youtube</a>
      <a class="link-btn" href="contact.html"><i class="fas fa-phone-volume"></i> Contact Us</a>
    </div>

    <p class="footer">© 2026 Chiaha Holdings Ltd</p>
  </div>

  <script>
    const track = document.getElementById('slides');
    const dots = document.querySelectorAll('.dot');
    const prevBtn = document.getElementById('prevSlide');
    const nextBtn = document.getElementById('nextSlide');
    let cur = 0;
    const TOTAL = 11; // Update this if you add/remove slides
    let timer;

    function goTo(n) {
      cur = (n + TOTAL) % TOTAL;
      track.style.transform = `translateX(-${cur * 100}%)`;
      dots.forEach((d, i) => d.classList.toggle('active', i === cur));
    }

    function resetTimer() {
      clearInterval(timer);
      timer = setInterval(() => goTo(cur + 1), 3500);
    }

    dots.forEach(d => d.onclick = () => {
      goTo(+d.dataset.i);
      resetTimer();
    });

    if (prevBtn) {
      prevBtn.onclick = () => {
        goTo(cur - 1);
        resetTimer();
      };
    }

    if (nextBtn) {
      nextBtn.onclick = () => {
        goTo(cur + 1);
        resetTimer();
      };
    }

    // Touch swipe support for mobile
    let touchStartX = 0;
    let touchEndX = 0;
    const sliderWrap = document.querySelector('.slider-wrap');
    if (sliderWrap) {
      sliderWrap.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });
      sliderWrap.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 40) {
          if (diff > 0) goTo(cur + 1);
          else goTo(cur - 1);
          resetTimer();
        }
      }, { passive: true });
    }

    resetTimer();
  </script>
</body>

</html>
